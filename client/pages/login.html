<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — MyCalendar</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/util/tailwind-config.js"></script>
    <script src="../js/util/handle-theme-flash.js"></script>
    <script type="module" src="../js/login.js" defer></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  </head>
  <body class="flex flex-col transition-colors duration-300 min-h-screen bg-slate-50 dark:bg-neutral-800 text-slate-900 dark:text-slate-200">
    <header class="border-b border-slate-200 dark:border-neutral-600 bg-white dark:bg-neutral-900">
      <div class="mx-auto max-w-md px-4 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600/10 text-indigo-700">📅</span>
          <span class="font-semibold tracking-tight">MyCalendar</span>
        </div>
        <a href="../index.html" class="text-sm text-indigo-700 hover:underline">Back</a>
      </div>
    </header>

    <main class="grow mx-auto max-w-md px-4 py-12">
      <div class="min-w-[25vw] rounded-2xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-neutral-900 p-6 shadow-sm">
        <h1 class="text-2xl font-semibold tracking-tight">Login</h1>

        <form id="loginForm" class="mt-6 space-y-4" novalidate>
          <div>
            <label for="name" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Name</label>
            <input
              id="name"
              name="name"
              type="text"
              required
              class="pl-2 mt-1 block w-full rounded-md border-slate-300 focus:border-indigo-500 focus:ring-indigo-500 text-black dark:bg-neutral-800 dark:text-slate-200"
              placeholder="e.g., Evan"
            />
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-200">CCU Email</label>
            <input
              id="email"
              name="email"
              type="email"
              required
              pattern=".+@(g\.coastal\.edu|coastal\.edu)$"
              class="pl-2 mt-1 block w-full rounded-md border-slate-300 focus:border-indigo-500 focus:ring-indigo-500 text-black dark:bg-neutral-800 dark:text-slate-200"
              placeholder="name@g.coastal.edu"
            />
            <p id="emailHint" class="mt-1 text-xs text-slate-500 dark:text-slate-400">Must end with @g.coastal.edu or @coastal.edu</p>
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              required
              minlength="3"
              class="pl-2 mt-1 block w-full rounded-md border-slate-300 focus:border-indigo-500 focus:ring-indigo-500 text-black dark:bg-neutral-800 dark:text-slate-200"
              placeholder="••••••••"
            />
          </div>

          <button
            type="submit"
            class="inline-flex items-center justify-center rounded-xl bg-indigo-600 px-5 py-3 text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 w-full"
          >
            Continue
          </button>

          <p id="formError" class="text-sm text-red-600 hidden mt-2"></p>
        </form>
      </div>
    </main>
    <div data-partial="../partials/footer.html"></div>
    <script type="module" src="../js/partials.js"></script>
  </body>
</html>
