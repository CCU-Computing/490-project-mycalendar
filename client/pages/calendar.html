<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Calendar — MyCalendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/util/tailwind-config.js"></script>
    <script src="../js/util/handle-theme-flash.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.14/index.global.min.js"></script>
  </head>

  <body class="flex flex-col transition-colors duration-300 min-h-screen bg-slate-50 dark:bg-neutral-800 text-slate-900 dark:text-slate-200">
    <div data-partial="../partials/nav.html"></div>

    <header class="border-b border-slate-200 dark:border-neutral-600 bg-white dark:bg-neutral-900">
      <div class="mx-auto max-w-6xl px-4 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600/10 text-indigo-700">📅</span>
          <span class="font-semibold tracking-tight">MyCalendar</span>
        </div>
        <div class="flex items-center gap-3">
          <span id="userChip" class="inline-flex items-center gap-2 rounded-xl border border-slate-300 dark:border-neutral-600 bg-white dark:bg-neutral-800 px-3 py-1 text-sm text-slate-700 dark:text-slate-200"></span>
          <a href="../index.html" class="text-sm text-indigo-700 hover:underline">Landing Page</a>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-8 space-y-8">
      <!-- Calendar Section -->
      <section class="rounded-2xl border border-slate-200 dark:border-neutral-600 bg-white dark:bg-neutral-900 shadow-sm flex flex-col min-h-[70vh]">
        <div class="px-5 py-4 border-b border-slate-200 dark:border-neutral-600 flex items-center justify-between">
          <h2 class="text-lg font-semibold tracking-tight">Calendar</h2>
          <span class="flex items-center space-x-4">
            <button id="calendarAddEventBtn" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 transition">Add Event</button>
            <button id="calendarRefreshBtn" class="text-sm text-indigo-700 hover:underline">Refresh</button>
          </span>
        </div>
        <div id="calendar" class="m-2 rounded-xl border border-slate-200 dark:border-neutral-600 bg-white dark:bg-neutral-800 p-2 shadow-sm flex-1"></div>
      </section>
    </main>

    <div data-partial="../partials/footer.html"></div>
    <script type="module" src="../js/partials.js"></script>
    <script type="module" src="../js/calendar.js"></script>
  </body>
</html>
